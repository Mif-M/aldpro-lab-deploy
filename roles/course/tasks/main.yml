# ==========================================
# Блок 7: Настройка PXE-загрузки для pxe-test-1
# ==========================================
- name: Настроить порядок PXE-загрузки для тестовой ВМ
  block:
    - name: Проверить наличие PXE-ВМ в libvirt
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ pxe_vm_name }}.{{ default_domain }}"
      register: pxe_dominfo
      changed_when: false
      failed_when: false
      become_user: "{{ administrator }}"
      become: true

    - name: Показать предупреждение, если PXE-ВМ отсутствует
      ansible.builtin.debug:
        msg: "ВНИМАНИЕ: ВМ '{{ pxe_vm_name }}.{{ default_domain }}' не зарегистрирована. Настройка PXE-загрузки пропущена."
      when: pxe_dominfo.rc != 0
      become_user: "{{ administrator }}"
      become: true

    - name: "Установить порядок загрузки: сеть, затем диск"
      ansible.builtin.command: >
        virt-xml -c qemu:///system {{ pxe_vm_name }}.{{ default_domain }}
        --edit
        --boot network,hd
      register: pxe_virtxml
      changed_when: "'XML updated' in pxe_virtxml.stdout"
      # Игнорируем ошибку, если изменения не требуются (порядок уже такой)
      failed_when: >
        pxe_virtxml.rc != 0 and
        'No changes' not in pxe_virtxml.stdout
      when: pxe_dominfo.rc == 0
      become_user: "{{ administrator }}"
      become: true

  become: true
  become_user: "{{ administrator }}"

# ==========================================
# Блок 8: Создание снимков настроенных машин (с перезаписью)
# ==========================================
- name: Создание снимков настроенных машин
  block:
    - name: Проверить наличие снимка
      ansible.builtin.shell:
        cmd: virsh -c qemu:///system snapshot-list "{{ item }}" --name | grep -Fx "{{ vm.start_snapshot }}"
      loop: "{{ vms | map(attribute='name') | map('regex_replace', '$', '.' + default_domain) | list }}"
      register: snap_check
      changed_when: false
      failed_when: false
      become_user: "{{ administrator }}"
      become: true

    - name: Удалить существующий снимок (если найден)
      ansible.builtin.shell:
        cmd: virsh -c qemu:///system snapshot-delete "{{ item }}" "{{ vm.start_snapshot }}"
      loop: "{{ vms | map(attribute='name') | map('regex_replace', '$', '.' + default_domain) | list }}"
      when: (snap_check.results | selectattr('item', 'equalto', item) | first).rc == 0
      become_user: "{{ administrator }}"
      become: true
      changed_when: true
      # Добавьте ignore_errors, если удаление может завершиться ошибкой
      # (например, когда снимок используется как текущий)
      ignore_errors: true

    - name: Создать снимок (всегда, после удаления или если отсутствовал)
      ansible.builtin.shell:
        cmd: virsh -c qemu:///system snapshot-create-as --name "{{ vm.start_snapshot }}" --domain "{{ item }}"
      loop: "{{ vms | map(attribute='name') | map('regex_replace', '$', '.' + default_domain) | list }}"
      become_user: "{{ administrator }}"
      become: true
      changed_when: true

  become: true
  become_user: "{{ administrator }}"
# ==========================================
# Блок 5: Финальные штрихи
# ==========================================

- name: Добавить записи Linux-ВМ в /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }}  {{ item.name }}.{{ item.domain | default(default_domain) }}  {{ item.name }}"
    state: present
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
